<style>
  :root {
    --ink: #1a1a18;
    --mustard: #f4d35e;
    --teal: #0b7a75;
    --terra: #c96442;
    --paper: #f7f3e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: var(--mustard);
  }
  body {
    font-family: "Nunito", "Noto Sans TC", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: 1280px; height: 720px; }
  .head {
    height: 88px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid var(--ink);
  }
  .head h1 {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .head .hand {
    font-family: "Caveat", "Noto Sans TC", cursive;
    font-size: 22px;
    font-weight: 700;
    color: var(--terra);
    margin-top: 8px;
  }
  .head-left { display: flex; flex-direction: column; }
  .head-right { text-align: right; }
  .tagbox {
    display: inline-block;
    border: 3px solid var(--ink);
    border-radius: 22px;
    padding: 6px 16px;
    background: var(--paper);
    font-size: 15px;
    font-weight: 700;
  }
  .head-right .sub {
    margin-top: 7px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0.72;
  }
  .scene { display: block; }
  .kicker {
    height: 60px;
    background: var(--ink);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 14px;
  }
  .kicker .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--terra);
    flex: none;
  }
  .kicker p {
    color: var(--mustard);
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }
  .kicker .en {
    margin-left: auto;
    font-family: "Caveat", cursive;
    font-size: 21px;
    color: var(--paper);
    opacity: 0.75;
  }
  .band {
    height: 72px;
    background: var(--paper);
    border-top: 4px solid var(--ink);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 18px;
  }
  .sw { display: flex; gap: 7px; flex: none; }
  .sw div { width: 34px; }
  .sw i {
    display: block;
    height: 32px;
    border: 2.5px solid var(--ink);
    border-radius: 5px;
  }
  .sw span {
    display: block;
    text-align: center;
    font-size: 8.5px;
    font-weight: 700;
    margin-top: 3px;
    letter-spacing: -0.2px;
    opacity: 0.8;
  }
  .rule { width: 3px; height: 46px; background: var(--ink); flex: none; }
  .band-txt { flex: 1; min-width: 0; }
  .band-txt .l1 { font-size: 13.5px; font-weight: 700; line-height: 1.35; }
  .band-txt .l2 { font-size: 12.5px; font-weight: 700; opacity: 0.68; margin-top: 3px; }
  .note {
    flex: none;
    border: 3px solid var(--terra);
    border-radius: 8px;
    padding: 7px 12px;
    color: var(--terra);
    font-size: 13px;
    font-weight: 900;
    background: #fff;
  }
  text { font-family: "Nunito", "Noto Sans TC", sans-serif; }
  .nm { font-size: 16.5px; font-weight: 900; }
  .cx { font-size: 13.5px; font-weight: 700; fill: #1a1a18; fill-opacity: 0.74; }
  .xtr { font-size: 12px; font-weight: 700; fill: #1a1a18; fill-opacity: 0.5; }
  .pill { font-size: 13px; font-weight: 900; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 17px; }
  .hand { font-family: "Caveat", "Noto Sans TC", cursive; font-weight: 700; }
  .fig { fill: #0b7a75; stroke: #1a1a18; stroke-width: 4; stroke-linejoin: round; }
  .lens { fill: #f7f3e8; fill-opacity: 0.55; stroke: #1a1a18; stroke-width: 5.5; }
  .arm { stroke: #1a1a18; stroke-width: 8; stroke-linecap: round; fill: none; }
  .miss { stroke: #1a1a18; stroke-width: 5; stroke-opacity: 0.34; stroke-dasharray: 13 9; stroke-linecap: round; fill: none; }
  .missend { fill: none; stroke: #1a1a18; stroke-width: 4.5; stroke-opacity: 0.34; }
</style>
