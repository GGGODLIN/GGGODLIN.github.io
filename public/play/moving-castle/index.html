<script>/* Original deterministic battle model. No network, dependencies, or external assets. */
(function(root){
'use strict';
const BUILDINGS={
 arrow:{name:'疾風箭塔',short:'箭塔',tag:'連射',color:'#d9c897',desc:'每秒射出弩箭。兩座箭塔一起裝，射速再快 40%。',stat:'10 傷害 / 1.05 秒',hp:118,atk:8,rate:1.6},
 cannon:{name:'熔爐重砲',short:'重砲',tag:'爆破',color:'#f39e53',desc:'重砲轟開城牆。緊鄰修復樹時，裝填加快 30%。',stat:'35 傷害 / 3.3 秒',hp:210,atk:20,rate:2.5},
 grove:{name:'修復古樹',short:'古樹',tag:'修復',color:'#87dab1',desc:'每 3 秒修復 10 城體。放在重砲旁，還能幫它冷卻。',stat:'修復 10 / 3 秒',hp:180,atk:9,rate:1.8},
 nest:{name:'石偶兵營',short:'兵營',tag:'召喚',color:'#b8a0ea',desc:'喚出最多 3 隻小石偶。每隻每秒造成 4 傷害。',stat:'每 3.5 秒召喚',hp:195,atk:12,rate:1.9}
};
const ROUTES=[['arrow'],['cannon','grove'],['nest','arrow'],['grove','cannon'],['boss']];
function makeEnemy(type,stage){
 if(type==='boss') return {type,name:'王冠堡壘',hp:465,maxHp:465,atk:15,rate:1.5,special:37,reward:null};
 const b=BUILDINGS[type], scale=stage===0?0.7:1+(stage-1)*.23;
 return {type,name:stage===0?'孤立的疾風哨塔':b.name,hp:Math.round(b.hp*scale),maxHp:Math.round(b.hp*scale),atk:stage===0?5:Math.round(b.atk*(1+stage*.08)),rate:b.rate,special:18+stage*5,reward:type};
}
class Game{
 constructor(){this.reset()}
 reset(){this.phase='ready';this.stage=0;this.hp=300;this.maxHp=300;this.slots=[null,null,null];this.enemy=makeEnemy('arrow',0);this.clock=0;this.battleTime=0;this.ramUsed=false;this.kills=0;this.totalDamage=0;this.events=[];this.minions=[];this.pendingLoot=null;this.graft=null;this.lastResult=null;this.paused=false;this.setTimers();return this;}
 setTimers(){this.coreTimer=.7;this.enemyTimer=1.4;this.slotTimers=[.5,.7,.9];this.specialTimer=8;this.windup=0;this.stun=0;this.minions=[];}
 event(type,data={}){this.events.push({type,...data})}
 drain(){const e=this.events;this.events=[];return e}
 start(type){if(!['ready','route'].includes(this.phase))return false;
 if(this.phase==='route'&&!ROUTES[this.stage].includes(type))return false;
 this.enemy=makeEnemy(type||'arrow',this.stage);this.phase='battle';this.ramUsed=false;this.battleTime=0;this.setTimers();this.event('start');return true;}
 damage(n,source='core',slot=-1){if(this.phase!=='battle')return;this.enemy.hp=Math.max(0,this.enemy.hp-n);this.totalDamage+=n;this.event('shot',{source,slot,damage:n});if(this.enemy.hp===0)this.win();}
 takeDamage(n,special=false){if(this.phase!=='battle')return;this.hp=Math.max(0,this.hp-n);this.event('enemyShot',{damage:n,special});if(this.hp===0){this.phase='lost';this.lastResult='lost';this.event('loss')}}
 ram(){if(this.phase!=='battle'||this.ramUsed||this.paused)return false;this.ramUsed=true;const cancelled=this.windup>0;this.windup=0;this.specialTimer=8;this.stun=2;this.event('ram',{cancelled});this.damage(52,'ram');return true;}
 heal(n){const before=this.hp;this.hp=Math.min(this.maxHp,this.hp+n);if(this.hp>before)this.event('heal',{amount:this.hp-before})}
 win(){if(this.phase!=='battle')return;this.kills++;this.minions=[];this.event('win');if(this.stage===4){this.phase='won';this.lastResult='won';return;}this.phase='loot';this.pendingLoot=this.enemy.reward;this.heal(34);}
 install(slot){if(this.phase!=='loot'||!this.pendingLoot||!Number.isInteger(slot)||slot<0||slot>2)return false;const old=this.slots[slot];this.graft={type:this.pendingLoot,slot,old,time:0};this.phase='grafting';this.event('graft',this.graft);return true;}
 skip(){if(this.phase!=='loot'||this.stage===0)return false;this.heal(34);this.pendingLoot=null;this.stage++;this.phase='route';this.event('route');return true;}
 synergies(){let a=[];if(this.slots.filter(x=>x==='arrow').length>=2)a.push('交叉火網 · 箭塔射速 +40%');if(this.slots.some((x,i)=>x==='cannon'&&(this.slots[i-1]==='grove'||this.slots[i+1]==='grove')))a.push('冷卻水循環 · 重砲裝填 +30%');if(this.slots.includes('nest')&&this.slots.includes('arrow'))a.push('弩兵護送 · 石偶傷害 +25%');return a;}
 tick(dt){if(this.paused)return;dt=Math.max(0,Math.min(dt,.1));this.clock+=dt;
 if(this.phase==='grafting'){this.graft.time+=dt;if(this.graft.time>=1.35){const installedSlot=this.graft.slot;this.slots[installedSlot]=this.graft.type;this.pendingLoot=null;this.graft=null;this.stage++;this.phase='route';this.event('installed',{slot:installedSlot})}return;}
 if(this.phase!=='battle')return;this.battleTime+=dt;this.stun=Math.max(0,this.stun-dt);
 this.coreTimer-=dt;if(this.coreTimer<=0){this.coreTimer+=1.2;this.damage(7,'core');}if(this.phase!=='battle')return;
 for(let i=0;i<3;i++){const b=this.slots[i];if(!b)continue;this.slotTimers[i]-=dt;if(this.slotTimers[i]>0)continue;
 if(b==='arrow'){this.slotTimers[i]+=1.05/(this.slots.filter(x=>x==='arrow').length>=2?1.4:1);this.damage(10,'arrow',i)}
 else if(b==='cannon'){const cooled=this.slots[i-1]==='grove'||this.slots[i+1]==='grove';this.slotTimers[i]+=3.3/(cooled?1.3:1);this.damage(35,'cannon',i)}
 else if(b==='grove'){this.slotTimers[i]+=3;this.heal(10);this.event('repair',{slot:i})}
 else if(b==='nest'){this.slotTimers[i]+=3.5;if(this.minions.length<3){this.minions.push({life:12,timer:.5});this.event('summon',{slot:i})}}
 if(this.phase!=='battle')return;
 }
 for(const m of this.minions){m.life-=dt;m.timer-=dt;if(m.timer<=0){m.timer+=1;this.damage(this.slots.includes('arrow')?5:4,'minion');}if(this.phase!=='battle')return;}
 this.minions=this.minions.filter(m=>m.life>0);
 if(this.stun>0)return;
 if(this.windup>0){this.windup-=dt;if(this.windup<=0){this.takeDamage(this.enemy.special,true);this.specialTimer=8;}return;}
 this.specialTimer-=dt;if(this.specialTimer<=0){this.windup=2.2;this.event('windup');return;}
 this.enemyTimer-=dt;if(this.enemyTimer<=0){this.enemyTimer+=this.enemy.rate;this.takeDamage(this.enemy.atk);}
 }
}
const API={Game,BUILDINGS,ROUTES,makeEnemy};if(typeof module!=='undefined'&&module.exports)module.exports=API;else root.CastleEngine=API;
})(typeof globalThis!=='undefined'?globalThis:this);

 if(ev.type==='shot'){if(ev.source==='ram')continue;const pos=ev.slot>=0?slotPos(ev.slot):{x:ev.source==='minion'?p+260:p-131,y:ev.source==='minion'?y-15:y-161};shots.push({x:pos.x+25,y:pos.y-(ev.source==='arrow'?85:ev.source==='cannon'?55:ev.source==='core'?0:15),tx:e+(Math.random()-.5)*60,ty:y-100-Math.random()*50,t:0,duration:ev.source==='cannon'?.55:.35,kind:ev.source,color:ev.source==='cannon'?'#ffc575':ev.source==='minion'?'#c9b3f0':'#f8e6af',arc:ev.source==='cannon'?58:0});if(ev.slot>=0)recoils[ev.slot]=1;enemyFlash=.5;if(ev.source==='cannon'){shake=3;play(75,.2,'sawtooth',.03)}else play(700,.035,'triangle',.012);floaters.push({x:e+(Math.random()-.5)*65,y:y-192,text:'−'+ev.damage,color:'#f1d39b',life:.8});}
 else if(ev.type==='enemyShot'){shots.push({x:e-30,y:y-170,tx:p,ty:y-90,t:0,duration:.35,kind:'enemy',color:'#ed957c',arc:30});playerFlash=1;shake=ev.special?8:2;floaters.push({x:p-80,y:y-190,text:'−'+ev.damage,color:'#f2a285',life:1,big:ev.special});play(100,.12,'triangle',.025)}
 else if(ev.type==='ram'){ramAnim=.7;shake=10;burst(e-55,y-80,24,'#f8ce8c');floaters.push({x:e-40,y:y-200,text:'−52',color:'#ffe5a4',life:1.2,big:true});say(ev.cancelled?'衝撞！打斷重擊':'衝撞！敵城暈眩');play(48,.3,'sawtooth',.06)}
 else if(ev.type==='heal'){floaters.push({x:p-110,y:y-220,text:'+'+ev.amount,color:'#a7f0c6',life:1.2});}
 else if(ev.type==='repair'){const s=slotPos(ev.slot);burst(s.x,s.y-85,7,'#a7f0c6');play(440,.12,'sine',.015)}
 else if(ev.type==='summon'){const s=slotPos(ev.slot);burst(s.x,s.y-30,11,'#d0b8ef');say('小石偶出發！');}
 else if(ev.type==='win'){shake=5;shots=[];burst(e,y-40,30,'#e6c68b');say(game.stage===4?'王冠倒下，魔城繼續前進':'攻下了！把整座塔帶走');play(430,.2,'triangle',.04);}
 else if(ev.type==='graft'){say('拆下、牽引、接上城頂');play(260,.22,'sine',.035);}
 else if(ev.type==='installed'){say('接合完成 · 下一仗替你出力');burst(slotPos(ev.slot).x,y-140,18,'#e7e5a8');play(650,.2,'triangle',.03);}
 else if(ev.type==='loss'){shots=[];say('城心熄滅了');play(70,.5,'sine',.05)}
 }
}
function start(type){if(game.start(type)){uiPhase='';play(190,.14,'triangle',.04);updateUI(true)}}
function install(i){if(game.install(i)){uiPhase='';updateUI(true)}}
function ram(){if(game.ram()){events();updateUI(true)}}
function actionRow(text,button){return `<div class="action-row"><p class="action-description">${text}</p>${button}</div>`}
function button(text,id,cls='primary'){return `<button class="${cls}" id="${id}">${text}</button>`}
function updateUI(force=false){$('hp-text').textContent=`${Math.ceil(game.hp)} / ${game.maxHp}`;$('hp-bar').style.width=(game.hp/game.maxHp*100)+'%';$('enemy-hp-text').textContent=`${Math.ceil(game.enemy.hp)} / ${game.enemy.maxHp}`;$('enemy-hp-bar').style.width=(game.enemy.hp/game.enemy.maxHp*100)+'%';$('enemy-name').textContent=game.enemy.name;$('round-label').textContent=game.phase==='ready'?'約 3 分鐘 · 5 場戰鬥':`第 ${Math.min(game.stage+1,5)} 站 / 5`;
 $('pause-overlay').hidden=!game.paused;$('pause').disabled=!['battle','grafting'].includes(game.phase);$('pause').textContent=game.paused?'繼續':'暫停';$('pause').setAttribute('aria-label',game.paused?'繼續遊戲':'暫停遊戲');
 if(game.phase==='battle'){
 const warn=game.windup>0;$('phase-title').textContent=warn?(game.ramUsed?'敵城蓄力中，準備承受重擊':'敵城蓄力中，現在衝撞能打斷！'):game.ramUsed?'讓搶來的建築替你作戰':'城體自動作戰，衝撞時機由你決定';$('field-caption').innerHTML=warn?`<span>!</span> 敵方重擊倒數 ${game.windup.toFixed(1)} 秒`:'<span>⚔</span> '+(game.slots.some(Boolean)?'看城頂：搶來的建築正在替你作戰':'城心正在自動射擊 · 你還有一次衝撞');
 const rb=$('ram');if(rb){rb.disabled=game.ramUsed||game.paused;rb.classList.toggle('danger',warn&&!game.ramUsed);rb.innerHTML=game.ramUsed?'衝撞已用完':warn?'衝撞 · 打斷重擊':`衝撞 <span class="key">SPACE</span>`}
 }
 if(force||uiPhase!==game.phase){uiPhase=game.phase;const a=$('actions');let k='',title='',caption='',tag='';
 if(game.phase==='ready'){k='一座會長大的城';title='把敵人的塔，變成你的力量';caption='<span>01</span> 先搶一座箭塔，讓它替你打下一仗';tag='第一站 · 奪取箭塔';a.innerHTML=actionRow('攻下眼前的哨塔。接著，連塔一起搶走。',button('出發，攻下箭塔','begin'));$('begin').onclick=()=>start('arrow');}
 else if(game.phase==='battle'){k='交戰中 · 自動作戰';title='城體自動作戰，衝撞時機由你決定';caption='';tag=game.stage===4?'終點 · 王冠堡壘':`第 ${game.stage+1} 站 · 交戰中`;a.innerHTML=actionRow(game.stage===0?'按一次衝撞，給它重重一擊。每場只能用一次。':'衝撞造成 52 傷害、暈眩敵城，還能打斷正在蓄力的重擊。',button('衝撞 <span class="key">SPACE</span>','ram','primary ram'));$('ram').onclick=ram;}
 else if(game.phase==='loot'){const b=BUILDINGS[game.pendingLoot],free=game.slots.indexOf(null);k='勝利 · 帶走戰利品';title=`整座${b.short}，現在是你的`;tag='攻城成功';caption='<span>＋</span> 戰後修復 +34 · 建築完整保留';a.innerHTML=actionRow(`${b.desc}${free===-1?' 城頂滿了，選下面一座建築替換。':''}`,free>=0?button(`把${b.short}接上魔城`,'take'):button('拆成材料 · 再修復 34','salvage','primary'));if(free>=0)$('take').onclick=()=>install(free);else $('salvage').onclick=()=>{game.skip();updateUI(true)};}
 else if(game.phase==='grafting'){k='接合中';title='把別人的城，長成自己的城';tag='建築移植';caption='<span>＋</span> 原本的敵塔，正在搬進你的魔城';a.innerHTML=actionRow('接上牽引索，抬起地基……',`<button class="primary" disabled>正在接合</button>`)}
 else if(game.phase==='route'){k='選擇下一站';title=game.stage===1?'剛搶的箭塔，跟你一起出發':game.stage===4?'最後一仗，攻下王冠堡壘':'下一座城，想帶走什麼？';tag=`準備前往第 ${game.stage+1} 站`;caption='<span>◆</span> '+(game.stage===1?'箭塔已安裝 · 下一仗開始自動連射':'你選擇的敵城，也決定下一件戰利品');
 if(game.stage===4){a.innerHTML=actionRow('重擊更猛烈的王冠堡壘就在前方。留好衝撞，讓整座魔城一起出力。',button('迎戰王冠堡壘','boss'));$('boss').onclick=()=>start('boss')}
 else{a.innerHTML='<div class="choices">'+ROUTES[game.stage].map(type=>{const b=BUILDINGS[type],e=CastleEngine.makeEnemy(type,game.stage);return `<button class="choice" data-route="${type}"><img class="mini-art" src="${icon(type)}" alt=""><div><h3>${b.name}</h3><p>${b.desc}</p><small>${b.tag} · 城體 ${e.hp} · 勝利後帶走</small></div><span class="take">攻下它</span></button>`}).join('')+'</div>';a.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>start(b.dataset.route));}}
 else if(game.phase==='won'){k='旅程完成';title='你帶走的，成了你的整座城';tag='五座城 · 一段旅程';caption='<span>♜</span> 王冠堡壘已攻陷';a.innerHTML=actionRow(`帶著 ${game.slots.filter(Boolean).length} 座戰利品建築，攻下 5 座堡壘。再走一次，試試另一種組合。`,button('再造一座魔城','again'));$('again').onclick=restart;}
 else if(game.phase==='lost'){k='魔城倒下';title='再換一個組合，重新上路';tag='旅程暫止';caption='<span>◇</span> 留到敵方蓄力時衝撞，可以少挨一次重擊';a.innerHTML=actionRow(`走到了第 ${game.stage+1} 站。${game.slots.includes('grove')?'試著把重砲裝在古樹旁邊，縮短裝填時間。':'下一次可以帶一座修復古樹，讓城體撐得更久。'}`,button('重新出發','again'));$('again').onclick=restart;}
 $('phase-kicker').textContent=k;$('phase-title').textContent=title;if(caption)$('field-caption').innerHTML=caption;$('battle-tag').textContent=tag;$('announcer').textContent=title;
 $('journey').innerHTML=Array.from({length:5},(_,i)=>`${i?'<b></b>':''}<i class="${i<game.stage||game.phase==='won'?'done':i===game.stage?'current':''}" title="第 ${i+1} 站"></i>`).join('');
 uiSlots='';
 }
 const slotKey=game.slots.join(',')+'|'+game.phase;if(uiSlots!==slotKey){uiSlots=slotKey;const choose=game.phase==='loot'&&game.slots.every(Boolean);$('slots').innerHTML=game.slots.map((b,i)=>`<button class="slot ${b?'filled':''} ${choose?'choose':''}" data-slot="${i}" ${choose?'':'disabled'} aria-label="${choose?'以'+BUILDINGS[game.pendingLoot].name+'替換':''}插槽 ${i+1} ${b?BUILDINGS[b].name:'空位'}">${b?`<img src="${icon(b)}" alt=""><span><strong>${choose?'替換 · ':''}${BUILDINGS[b].short}</strong><small>${BUILDINGS[b].tag}</small></span>`:`<span class="number">${i+1}</span><strong>空插槽</strong>`}</button>`).join('');if(choose)$('slots').querySelectorAll('button').forEach(b=>b.onclick=()=>install(Number(b.dataset.slot)));$('slot-hint').textContent=choose?'點選要替換的建築':'搶來的建築，接在這裡';const synergy=game.synergies();$('synergy').textContent=synergy.length?synergy.join(' ／ '):'三個插槽，一座屬於你的魔城';$('synergy').className=synergy.length?'active':'';}
}
function restart(){game.reset();shots=[];particles=[];floaters=[];ramAnim=0;toastTimer=0;shake=0;recoils=[0,0,0];uiPhase='';uiSlots='';updateUI(true)}
function pause(){if(!['battle','grafting'].includes(game.phase))return;game.paused=!game.paused;updateUI();}
$('pause').onclick=pause;$('resume').onclick=pause;$('restart').onclick=restart;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'音效 開':'音效 關';$('sound').setAttribute('aria-pressed',sound);$('sound').setAttribute('aria-label',sound?'關閉音效':'開啟音效');if(sound)play(440,.1,'sine',.03)};
addEventListener('keydown',e=>{if(e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;if(e.code==='Space'){if(document.activeElement?.tagName==='BUTTON')return;e.preventDefault();ram()}else if(e.code==='KeyP'){e.preventDefault();pause()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!game.paused&&['battle','grafting'].includes(game.phase)){game.paused=true;updateUI()}});
function frame(now){let dt=Math.min(.05,(now-last)/1000||.016);last=now;if(!game.paused)visualTime+=dt;game.tick(dt);events();updateUI();render(game.paused?0:dt);requestAnimationFrame(frame)}
updateUI(true);requestAnimationFrame(frame);
// A read-only snapshot supports practical smoke tests without granting mutation hooks.
Object.defineProperty(window,'castleSnapshot',{get:()=>({phase:game.phase,stage:game.stage,hp:game.hp,enemyHp:game.enemy.hp,enemyType:game.enemy.type,slots:[...game.slots],battleTime:game.battleTime,paused:game.paused,ramUsed:game.ramUsed,synergies:game.synergies(),minions:game.minions.length})});
})();
</script>
</body></html>
